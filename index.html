<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT20 Team Finder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #003366;
            font-size: 34px;
        }

        p {
            font-size: 18px;
        }

        input {
            width: 100%;
            max-width: 600px;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        #nameList {
            width: 100%;
            max-width: 600px;
            max-height: 300px;
            margin: 12px auto 0;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: white;
            text-align: left;
        }

        .member-item {
            padding: 14px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 17px;
        }

        .member-item:last-child {
            border-bottom: none;
        }

        .member-item:hover {
            background: #f3f7fc;
        }

        .member-item.selected {
            background: #0078d4;
            color: white;
        }

        button {
            margin-top: 20px;
            padding: 14px 30px;
            font-size: 18px;
            cursor: pointer;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 8px;
        }

        button:hover {
            background: #106ebe;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }

        #memberCount {
            color: #666;
            margin-top: 15px;
            font-size: 16px;
        }

        @media (max-width: 600px) {
            body {
                margin: 15px auto;
                padding: 16px;
            }

            h1 {
                font-size: 30px;
            }

            p {
                font-size: 17px;
            }

            .member-item {
                font-size: 16px;
                padding: 13px;
            }

            button {
                width: 100%;
                max-width: 350px;
            }
        }
    </style>
</head>

<body>

    <h1>🎉 IT20 Team Finder</h1>

    <p>Type your first name or last name and select from the list.</p>

    <input
        type="text"
        id="searchText"
        placeholder="Example: Pakorn or Skunsongbunsiri"
    >

    <div id="nameList"></div>

    <button id="findButton">Find My Team</button>

    <div id="result"></div>
    <div id="memberCount"></div>

    <script src="./members.js?v=3"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const searchText = document.getElementById("searchText");
            const nameList = document.getElementById("nameList");
            const findButton = document.getElementById("findButton");
            const result = document.getElementById("result");
            const memberCount = document.getElementById("memberCount");

            let selectedName = "";

            if (typeof members === "undefined") {
                result.innerHTML =
                    "<span style='color:red'>Unable to load members.js</span>";
                return;
            }

            memberCount.textContent =
                "Loaded " + members.length + " members";


            function populateList(data) {

                nameList.innerHTML = "";
                selectedName = "";

                const sortedData = [...data].sort(
                    (a, b) => a.name.localeCompare(b.name)
                );

                sortedData.forEach(member => {

                    const item =
                        document.createElement("div");

                    item.className = "member-item";

                    item.textContent =
                        member.name +
                        " (Team " +
                        member.team +
                        ")";

                    item.dataset.name = member.name;

                    item.addEventListener("click", function () {

                        document
                            .querySelectorAll(".member-item")
                            .forEach(el =>
                                el.classList.remove("selected")
                            );

                        item.classList.add("selected");

                        selectedName =
                            item.dataset.name;
                    });

                    nameList.appendChild(item);
                });
            }


            function filterNames() {

                const search =
                    searchText.value
                        .toLowerCase()
                        .trim();

                if (search === "") {
                    populateList(members);
                    return;
                }

                const filtered =
                    members.filter(member =>
                        member.name
                            .toLowerCase()
                            .includes(search)
                    );

                populateList(filtered);
            }


            function openTeam() {

                if (!selectedName) {

                    const firstItem =
                        nameList.querySelector(
                            ".member-item"
                        );

                    if (firstItem) {
                        selectedName =
                            firstItem.dataset.name;
                    }
                }

                if (!selectedName) {
                    alert(
                        "Please search and select your name."
                    );
                    return;
                }

                const found =
                    members.find(
                        member =>
                            member.name === selectedName
                    );

                if (!found) {
                    alert("Name not found.");
                    return;
                }

                result.innerHTML =
                    "<strong>" +
                    found.name +
                    "</strong><br>" +
                    "Team " +
                    found.team +
                    "<br><br>" +
                    "Opening team photo...";

                const teamPhoto =
                    "./TeamPhoto/Team" +
                    found.team +
                    ".png";

                setTimeout(function () {
                    window.location.href =
                        teamPhoto;
                }, 700);
            }


            searchText.addEventListener(
                "input",
                filterNames
            );

            findButton.addEventListener(
                "click",
                openTeam
            );

            searchText.addEventListener(
                "keydown",
                function (event) {
                    if (event.key === "Enter") {
                        openTeam();
                    }
                }
            );

            populateList(members);
        });
    </script>

</body>
</html>
